[mod-setting-name]
allow-casting-foundation=Позволяет литейным лить фундаменты.
allow-casting-concrete=Разрешает литьё бетона.
allow-casting-walls=Разрешает литьё стен.
allow-stone-to-lava=Разрешить плавить камень (или песок) в лаву
lava-melting-efficiency=Эффективность переплавки камня (или песка) в лаву (%)
complex-lava-mode=Усложнённый режим.
expensive-lava-mode=Дорогой режим.

[mod-setting-description]
allow-casting-foundation=Может показаться нечестным из-за бонуса продуктивности.
allow-stone-to-lava=Во избежание замкнутого цикла, дающего бесконечную лаву, этот рецепт лишь отчасти так эффективен, как обратный ему.
lava-melting-efficiency=25 % должны быть нейтральными, изначально значение было равно 50 %.
complex-lava-mode=Добавляет кальцит в рецепты плавки, чтобы слегка усложнить игровой процесс.
expensive-lava-mode=Добавляет кальцит в рецепты литья каменных продуктов, делая их ещё дороже. Устаревшая опция. Совместима с усложнённый режимом.