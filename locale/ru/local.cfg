[technology-description]
lava-to-stone-tech=Открывает рецепты переработки лавы в камень и каменные продукты.
casting-concrete-tech=Разблокирует возможность отливать бетон и железобетон.
casting-foundation-tech=Открывает рецепт литья фундаментов в литейной.
casting-wall-tech=Разблокирует возможность отливать стены и ворота напрямую из лавы.

kr-advanced-mineral-processing-tech=Разблокирует возможность создавать кремний и кварц из лавы.
cast-reinforced-plates-tech=OC1024: Я уплотняю грунт. А вы?

[mod-setting-name]
allow-casting-foundation=Позволить литейным отливать фундаменты.
allow-casting-concrete=Позволить отливать бетон и железобетон
allow-casting-walls=Позволить отливать стены
allow-stone-to-lava=Позволить плавить камень (или песок) до лавы
lava-melting-efficiency=Эффективность плавления камня (или песка) в лаву (%)
complex-lava-mode=Усложнённый режим
expensive-lava-mode=Дорогой режим

[mod-setting-description]
allow-casting-foundation=Может восприниматься нечестным из-за бонуса продуктивности
allow-stone-to-lava=Этот рецепт лишь отчасти так хорош, как обратный ему, из-за соображений пресечения замкнутого цикла, дающего бесконечный камень\лаву.
lava-melting-efficiency=25% должно быть нейтральным. Изначальной величиной было 50%.
complex-lava-mode=Добавляет кальцит в рецепты плавки, чтобы сделать производство на основе лавы более сложным.
expensive-lava-mode=Добавляет кальцит в рецепты литья, чтобы сделать производство каменных продуктов ещё дороже. Изначальная опция. Совместим с усложнённым режимом.

