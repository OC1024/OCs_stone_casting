[mod-name]
title=OCs Lavagießerei

[mod-description]
description=Ein kleinen Mod, mit der Stein und andere zugehörige Produkte zusätzlich aus Lava erzeugen kann.

[recipe-name]
lava-to-stone=Stein aus Lava gießen
stone-to-lava=Stein zu Lava verflüssigen
sand-to-lava=Sand zu Lava verflüssigen
lava-to-brick=Ziegelsteine aus Lava gießen
lava-to-wall=Mauern aus Lava gießen
casting-stone-wall=Steinmauer aus Lava gießen
casting-concrete-wall=Betonmauer aus Lava gießen
casting-steel-wall=Stahlmauer aus Lava gießen
lava-to-landfill=Landaufschüttung aus Lava gießen
lava-to-sand=Sand aus Lava gießen
casting-foundation=Fundamente gießen
casting-concrete=Beton aus Lava gießen
casting-refined-concrete=Stahlbeton aus Lava gießen

casting-rail=Gleis gießen
casting-wall=Mauer gießen
casting-gate=Tor gießen
casting-stone-furnace=Schmelzofen gießen
casting-steel-furnace=Hochofen gießen

[technology-name]
lava-to-stone-tech=Stein aus Lava gießen
casting-foundation-tech=Fundamente gießen
casting-concrete-tech=Beton aus Lava gießen
casting-wall-tech=Mauern und Tore aus Lava gießen
casting-stone-wall-tech=Steinmauer aus Lava gießen

[technology-description]
lava-to-stone-tech=Schaltet Rezepte zur Erzeugung von Stein und Steinprodukten aus Lava frei.
casting-concrete-tech=Schaltet die Herstellung von Beton und Stahlbeton direkt aus Lava frei.
casting-foundation-tech=Schaltet die Herstellung von Fundamenten in der Gießerei frei.
casting-wall-tech=Schaltet die Herstellung von Mauern und Toren direkt aus Lava frei.

[mod-setting-name]
allow-casting-foundation=Aktiviert das Gießen Fundamente
allow-casting-concrete=Aktiviert das Gießen von Beton und Stahlbeton
allow-casting-walls=Aktiviert das Gießen von Mauern
allow-stone-to-lava=Erlaubt die Erzeugung von Lava aus Stein
expensive-lava-mode=Komplexer Modus

[mod-setting-description]
allow-casting-foundation=Kann aufgrund des Produktivitätsbonus als Schummeln gesehen weren.
allow-stone-to-lava=Das Rezept ist halb so gut wie die Vorwärtsreaktion, um die Nützlichkeit einer Schleife zu reduzieren.
expensive-lava-mode=Füge Kalzit zu den Rezepten hinzu, um die Herstellung von Stein und Folgeprodukte aus Lava komplexer zu gestalten.