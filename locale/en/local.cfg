[mod-name]
title=OCs Stone Casting

[mod-description]
description=Adds a variety of recipes from lava to stone and other, similar products.

[recipe-name]
lava-to-stone-recipe=lava to stone
stone-to-lava-recipe=melt stone to lava
sand-to-lava-recipe=melt sand to lava
lava-to-brick-recipe=lava to stone brick
lava-to-wall-recipe=lava to wall
lava-to-stone-wall-recipe=lava to stone wall
lava-to-concrete-wall-recipe=lava to concrete wall
lava-to-steel-wall-recipe=lava to steel wall
lava-to-landfill-recipe=lava to landfill
lava-to-sand-recipe=lava to sand
casting-foundation-recipe=casting foundations
casting-concrete-recipe=lava to concrete
casting-refined-concrete-recipe=lava to refined concrete

casting-rail=casting rail
casting-wall=casting wall
casting-gate=casting gate
casting-stone-furnace=casting stone furnace
casting-steel-furnace=casting steel furnace

[technology-name]
lava-to-stone-tech=Lava to Stone Technology
casting-foundation-tech=Casting Foundation Technology
casting-concrete-tech=Casting Concrete Technology
casting-walls-tech=Casting Walls Technology
casting-stone-wall-tech=Casting Stone Walls Technology
casting-wall-tech=Casting walls and gates from lava

[technology-description]
lava-to-stone-tech=Unlocks new recipes to convert lava into stone and stone products.
casting-concrete-tech=Unlocks the ability to cast concrete and refined concrete.
casting-foundation-tech=Unlocks a recipe for casting foundations in the foundry.
casting-wall-tech=Unlocks the abillity to cast walls and gates directly from lava.

[mod-setting-name]
allow-casting-foundation=Allow foundries to cast foundations.
allow-casting-concrete=Allow casting concrete and refined concrete
allow-casting-walls=Allow casting walls
allow-stone-to-lava=Allow creating lava from stone
expensive-lava-mode=Complex Mode

[mod-setting-description]
allow-casting-foundation=Can be seen as cheaty due to the productivity bonus
allow-stone-to-lava=The recipe is half as good as the forward reaction to reduce the usefullness of a loop.
expensive-lava-mode=Add calcite to the recipes to make the production of stone and related products from lava more complex.